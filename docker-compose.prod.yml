services:
    app:
        image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        env_file:
            - ${APP_ENV_FILE:-.env.production}
        environment:
            NODE_ENV: production
            PORT: 3000
            HOSTNAME: 0.0.0.0
            DATABASE_URL: file:/data/portfolio.db
        volumes:
            - sqlite_data:/data
        ports:
            - '127.0.0.1:${APP_PORT:-3001}:3000'
        networks:
            - web
            - shared-services

    migrate:
        image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
        env_file:
            - ${APP_ENV_FILE:-.env.production}
        environment:
            NODE_ENV: production
            DATABASE_URL: file:/data/portfolio.db
        volumes:
            - sqlite_data:/data
        command: ['pnpm', 'db:migrate']
        restart: 'no'
        networks:
            - web
            - shared-services

volumes:
    sqlite_data:

networks:
    web:
        driver: bridge
    shared-services:
        external: true
        name: shared-services
