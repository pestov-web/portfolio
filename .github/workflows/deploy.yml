name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    quality:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    build:
        needs: quality
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=sha-${{ github.sha }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_APP_URL=https://pestov-web.ru
                      NEXT_PUBLIC_MINIO_BUCKET=portfolio

    deploy:
        needs: build
        timeout-minutes: 15
        runs-on:
            - self-hosted
            - linux
            - portfolio-prod
        permissions:
            contents: read
            packages: read

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
            DEPLOY_PATH: /home/mwk/apps/portfolio
            GHCR_IMAGE: ghcr.io/${{ github.repository }}
            APP_PORT: 3001

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Select verified revision
              run: echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

            - name: Ensure deploy directory exists
              run: mkdir -p "$DEPLOY_PATH/deploy" "$DEPLOY_PATH/backups"

            - name: Back up current release configuration
              run: bash deploy/backup.sh

            - name: Sync deploy files
              run: |
                  cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
                  cp deploy/nginx.pestov-web.ru.conf "$DEPLOY_PATH/deploy/nginx.pestov-web.ru.conf"

            - name: Write production env file
              env:
                  PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
              run: |
                  test -n "$PRODUCTION_ENV_FILE"
                  test -s "$DEPLOY_PATH/.env.storage"
                  umask 077
                  printf '%s\n' "$PRODUCTION_ENV_FILE" > "$DEPLOY_PATH/.env.production"
                  cat "$DEPLOY_PATH/.env.storage" >> "$DEPLOY_PATH/.env.production"

            - name: Write deploy env file
              run: |
                  umask 077
                  cat > "$DEPLOY_PATH/.deploy.env" <<EOF
                  GHCR_IMAGE=${GHCR_IMAGE}
                  IMAGE_TAG=${IMAGE_TAG}
                  APP_ENV_FILE=.env.production
                  APP_PORT=${APP_PORT}
                  EOF

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull application image
              run: |
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml pull app migrate

            - name: Apply database migrations
              # The existing writer must be stopped before SQLite is copied or migrated.
              run: |
                  bash deploy/backup.sh sqlite
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml run --rm migrate

            - name: Restart application
              run: |
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml up -d --wait --wait-timeout 90 app

            - name: Verify public site
              run: test "$(curl --fail --silent --show-error --max-time 20 https://pestov-web.ru/api/health)" = '{"status":"ok"}'

            - name: Deployment failure details
              if: failure()
              run: |
                  echo "Deployment failed. Inspect the backup under $DEPLOY_PATH/backups before any rollback."
                  if test -f "$DEPLOY_PATH/.deploy.env"; then
                    cd "$DEPLOY_PATH"
                    docker compose --env-file .deploy.env -f docker-compose.prod.yml ps -a
                  fi
