name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NEXT_PUBLIC_APP_URL=https://pestov-web.ru
                      NEXT_PUBLIC_MINIO_BUCKET=portfolio

    deploy:
        needs: build
        runs-on:
            - self-hosted
            - linux
            - portfolio-prod
        permissions:
            contents: read
            packages: read

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
            DEPLOY_PATH: /home/mwk/apps/portfolio
            GHCR_IMAGE: ghcr.io/${{ github.repository }}
            APP_PORT: 3001

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compute short SHA
              run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

            - name: Ensure deploy directory exists
              run: mkdir -p "$DEPLOY_PATH/deploy"

            - name: Sync deploy files
              run: |
                  cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
                  cp deploy/nginx.pestov-web.ru.conf "$DEPLOY_PATH/deploy/nginx.pestov-web.ru.conf"

            - name: Write production env file
              run: |
                  cat > "$DEPLOY_PATH/.env.production" <<'EOF'
                  ${{ secrets.PRODUCTION_ENV_FILE }}
                  EOF

            - name: Write deploy env file
              run: |
                  cat > "$DEPLOY_PATH/.deploy.env" <<EOF
                  GHCR_IMAGE=${GHCR_IMAGE}
                  IMAGE_TAG=${IMAGE_TAG}
                  APP_ENV_FILE=.env.production
                  APP_PORT=${APP_PORT}
                  EOF

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull application image
              run: |
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml pull app migrate

            - name: Apply database migrations
              run: |
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml run --rm migrate

            - name: Restart application
              run: |
                  cd "$DEPLOY_PATH"
                  docker compose --env-file .deploy.env -f docker-compose.prod.yml up -d app
