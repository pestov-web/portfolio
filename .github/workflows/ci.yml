name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./portfolio.db
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: test-test-test-test-test-test-test-test
      AUTH_GITHUB_ID: ci
      AUTH_GITHUB_SECRET: ci
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      AUTH_YANDEX_ID: ci
      AUTH_YANDEX_SECRET: ci
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: portfolio
      MINIO_USE_SSL: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm db:migrate

      - name: Check FSD
        run: pnpm fsd:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build app
        run: pnpm build

      - name: Seed test database
        run: pnpm seed

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: UI regression tests
        run: pnpm exec playwright test

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7
